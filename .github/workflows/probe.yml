name: probe-hn
on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v4
        with:
          go-version: "1.24.1"
      - name: egress ip
        run: curl -s -m 20 https://api.ipify.org; echo
      - name: curl matrix
        run: |
          check() { code=$(curl -s -o /dev/null -w '%{http_code}' -m 20 "$@" || echo ERR); echo "CODE=$code ARGS=$*"; }
          check https://news.ycombinator.com/rss
          check --http1.1 https://news.ycombinator.com/rss
          check --http2 https://news.ycombinator.com/rss
          check -A 'Mozilla/5.0 (X11; Linux x86_64) Chrome/124.0' https://news.ycombinator.com/rss
          check -A '' https://news.ycombinator.com/rss
          check https://news.ycombinator.com/
          check https://hnrss.org/frontpage
          check 'https://hn.algolia.com/api/v1/search?tags=front_page'
          check https://hacker-news.firebaseio.com/v0/topstories.json
      - name: go probe
        run: go run ./cmd/probe
